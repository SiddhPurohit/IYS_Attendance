name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a rebuild manually from the Actions tab without a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-progress one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - run: flutter pub get

      # base-href must match the repo name — GitHub Pages serves a project
      # site at github.io/<repo-name>/, and Flutter needs to know that
      # prefix to load its own JS/asset bundle correctly.
      - run: flutter build web --release --base-href /IYS_Attendance/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
